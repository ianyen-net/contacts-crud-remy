  <style id="gate-styles">
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Google Sans', 'Google Sans Text', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d1117;
      color: #e8eaed;
      -webkit-font-smoothing: antialiased;
    }
    .gate-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(600px circle at 20% 20%, rgba(253, 160, 252, 0.12), transparent 60%),
        radial-gradient(700px circle at 80% 80%, rgba(87, 140, 255, 0.14), transparent 60%),
        #0b0e17;
    }
    .gate-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 32px 32px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
      animation: gateEnter 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes gateEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .gate-sparkle {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(253, 160, 252, 0.16), rgba(87, 140, 255, 0.18), rgba(0, 83, 195, 0.22));
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .gate-sparkle svg {
      width: 26px;
      height: 26px;
    }
    .gate-title {
      font-size: 22px;
      font-weight: 500;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .gate-sub {
      font-size: 14px;
      line-height: 1.5;
      color: #9aa0a6;
      margin: 0 0 24px;
    }
    .gate-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gate-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .gate-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .gate-input:focus {
      border-color: #578CFF;
      box-shadow: 0 0 0 3px rgba(87, 140, 255, 0.22);
    }
    .gate-input::placeholder {
      color: #6e7681;
    }
    .gate-btn {
      height: 48px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #FDA0FC 0%, #578CFF 50%, #2B6EF0 100%);
      color: #0b0e17;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(87, 140, 255, 0.3);
    }
    .gate-btn:hover {
      opacity: 0.94;
      box-shadow: 0 8px 24px rgba(87, 140, 255, 0.42);
    }
    .gate-btn:active {
      transform: scale(0.985);
    }
    .gate-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .gate-err {
      min-height: 20px;
      font-size: 13px;
      color: #ff8982;
      margin-top: 4px;
    }
    .gate-badge {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6e7681;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .is-shake {
      animation: shake 0.35s ease;
    }
  </style>

    const SESSION_KEY = 'mc_proto_pass_v1';

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function decryptPayload(password) {
      const enc = new TextEncoder();
      const salt = b64ToBytes(PAYLOAD.salt);
      const iv = b64ToBytes(PAYLOAD.iv);
      const mac = b64ToBytes(PAYLOAD.mac);
      const ct = b64ToBytes(PAYLOAD.ct);
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
      );
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
        keyMaterial,
        512
      );
      const keyBytes = new Uint8Array(bits);
      const encKeyBytes = keyBytes.slice(0, 32);
      const macKeyBytes = keyBytes.slice(32, 64);

      const hmacKey = await crypto.subtle.importKey(
        'raw', macKeyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']
      );
      const msgToVerify = new Uint8Array(iv.length + ct.length);
      msgToVerify.set(iv, 0);
      msgToVerify.set(ct, iv.length);
      const valid = await crypto.subtle.verify('HMAC', hmacKey, mac, msgToVerify);
      if (!valid) throw new Error('Invalid password');

      const aesKey = await crypto.subtle.importKey(
        'raw', encKeyBytes, { name: 'AES-CBC' }, false, ['decrypt']
      );
      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-CBC', iv: iv },
        aesKey,
        ct
      );
      const decText = new TextDecoder().decode(decryptedBuf);
      return JSON.parse(decText);
    }

    function mountPrototype(data) {
      document.title = data.title || document.title;
      // Inject decrypted styles
      (data.styles || []).forEach((cssText) => {
        const st = document.createElement('style');
        st.textContent = cssText;
        document.head.appendChild(st);
      });
      // Remove gate styles & markup
      const gs = document.getElementById('gate-styles');
      if (gs) gs.remove();
      document.body.innerHTML = data.body;
      // Execute scripts sequentially in order
      (data.scripts || []).forEach((jsText) => {
        const sc = document.createElement('script');
        sc.type = 'module';
        sc.textContent = jsText;
        document.body.appendChild(sc);
      });
    }

    async function tryUnlock(password, isAuto) {
      const btn = document.getElementById('gate-btn');
      const err = document.getElementById('gate-err');
      const card = document.getElementById('gate-card');
      if (btn) { btn.disabled = true; btn.textContent = 'Unlocking...'; }
      if (err) err.textContent = '';
      try {
        const data = await decryptPayload(password);
        try { sessionStorage.setItem(SESSION_KEY, password); } catch (e) {}
        mountPrototype(data);
      } catch (e) {
        if (isAuto) {
          try { sessionStorage.removeItem(SESSION_KEY); } catch (ex) {}
          if (btn) { btn.disabled = false; btn.textContent = 'Unlock prototype'; }
          return;
        }
        if (btn) { btn.disabled = false; btn.textContent = 'Unlock prototype'; }
        if (err) err.textContent = 'Incorrect password. Please try again.';
        if (card) {
          card.classList.remove('is-shake');
          void card.offsetWidth;
          card.classList.add('is-shake');
        }
      }
    }

    let saved = null;
    try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
    if (saved) {
      const wrap = document.getElementById('gate-wrap');
      if (wrap) wrap.style.opacity = '0';
      tryUnlock(saved, true).then(() => {
        const w = document.getElementById('gate-wrap');
        if (w) w.style.opacity = '1';
      });
    }

    const form = document.getElementById('gate-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const val = document.getElementById('gate-input').value;
        tryUnlock(val, false);
      });
    }
  })();
  </script>
</body>
</html>
